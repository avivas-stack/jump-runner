<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jump Runner</title>
<style>
  body { margin: 0; background: #1a1a2e; font-family: monospace; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  h1 { margin: 10px; }
  #game { background: linear-gradient(#87ceeb 0%, #87ceeb 75%, #5a3a1a 75%, #5a3a1a 100%); border: 4px solid #fff; border-radius: 8px; display: block; }
  #info { margin-top: 10px; font-size: 14px; opacity: 0.8; }
  #score { font-size: 20px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>🏃 Jump Runner</h1>
  <canvas id="game" width="800" height="300"></canvas>
  <div id="score">Score: 0 &nbsp; | &nbsp; High: 0</div>
  <div id="info">SPACE / ↑ / Click to jump &nbsp;•&nbsp; Hold for higher jump &nbsp;•&nbsp; R to restart</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND_Y = H * 0.75;

const player = {
  x: 80, y: GROUND_Y, w: 30, h: 40,
  vy: 0, onGround: true, jumpHeld: false,
};

const GRAVITY = 0.8;
const JUMP_V = -13;
const JUMP_HOLD_BOOST = -0.4;

let obstacles = [];
let clouds = [];
let speed = 6;
let score = 0;
let high = parseInt(localStorage.getItem('jumpHigh') || '0');
let gameOver = false;
let frame = 0;

function spawnObstacle() {
  const isTall = Math.random() < 0.3;
  obstacles.push({
    x: W,
    w: 20 + Math.random() * 20,
    h: isTall ? 50 + Math.random() * 20 : 25 + Math.random() * 15,
  });
}

function spawnCloud() {
  clouds.push({ x: W, y: 30 + Math.random() * 100, w: 40 + Math.random() * 40, speed: 1 + Math.random() });
}

let nextObstacle = 60;
let nextCloud = 100;

function reset() {
  obstacles = []; clouds = []; speed = 6; score = 0; frame = 0;
  player.y = GROUND_Y; player.vy = 0; player.onGround = true;
  gameOver = false; nextObstacle = 60; nextCloud = 100;
}

function update() {
  if (gameOver) return;
  frame++;
  score = Math.floor(frame / 5);
  speed = 6 + Math.min(8, frame / 400);

  // Player physics
  player.vy += GRAVITY;
  if (player.jumpHeld && player.vy < 0) player.vy += JUMP_HOLD_BOOST;
  player.y += player.vy;
  if (player.y >= GROUND_Y) { player.y = GROUND_Y; player.vy = 0; player.onGround = true; }

  // Spawn
  if (--nextObstacle <= 0) { spawnObstacle(); nextObstacle = 60 + Math.random() * 80 - Math.min(30, frame / 100); }
  if (--nextCloud <= 0) { spawnCloud(); nextCloud = 100 + Math.random() * 150; }

  // Move
  obstacles.forEach(o => o.x -= speed);
  clouds.forEach(c => c.x -= c.speed);
  obstacles = obstacles.filter(o => o.x + o.w > 0);
  clouds = clouds.filter(c => c.x + c.w > 0);

  // Collide
  for (const o of obstacles) {
    const px = player.x, py = player.y - player.h;
    if (px < o.x + o.w && px + player.w > o.x && py < GROUND_Y && py + player.h > GROUND_Y - o.h) {
      gameOver = true;
      if (score > high) { high = score; localStorage.setItem('jumpHigh', high); }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Sky already in CSS background, but redraw sun
  ctx.fillStyle = '#ffe066';
  ctx.beginPath(); ctx.arc(W - 80, 60, 30, 0, Math.PI * 2); ctx.fill();

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.w / 2, 0, Math.PI * 2);
    ctx.arc(c.x + c.w / 3, c.y - 8, c.w / 2.5, 0, Math.PI * 2);
    ctx.arc(c.x + c.w / 2, c.y + 3, c.w / 2.2, 0, Math.PI * 2);
    ctx.fill();
  });

  // Ground line
  ctx.strokeStyle = '#3a2a0a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();

  // Ground texture (moving dashes)
  ctx.strokeStyle = '#7a5a2a';
  for (let i = 0; i < 20; i++) {
    const x = (i * 60 - (frame * speed) % 60);
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 15); ctx.lineTo(x + 30, GROUND_Y + 15); ctx.stroke();
  }

  // Obstacles (cacti)
  obstacles.forEach(o => {
    ctx.fillStyle = '#2d6a3f';
    ctx.fillRect(o.x, GROUND_Y - o.h, o.w, o.h);
    ctx.fillStyle = '#1d4a2f';
    ctx.fillRect(o.x + 3, GROUND_Y - o.h + 5, 4, o.h - 10);
  });

  // Player (simple character)
  const px = player.x, py = player.y - player.h;
  // body
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(px + 6, py + 15, 18, 20);
  // head
  ctx.fillStyle = '#ffd6a5';
  ctx.fillRect(px + 8, py, 14, 14);
  // eye
  ctx.fillStyle = '#000';
  ctx.fillRect(px + 18, py + 5, 3, 3);
  // legs (animated when running)
  ctx.fillStyle = '#333';
  const legFrame = player.onGround ? Math.floor(frame / 5) % 2 : 0;
  if (legFrame === 0) {
    ctx.fillRect(px + 6, py + 33, 6, 7);
    ctx.fillRect(px + 18, py + 33, 6, 7);
  } else {
    ctx.fillRect(px + 4, py + 33, 6, 7);
    ctx.fillRect(px + 20, py + 33, 6, 7);
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
    ctx.font = '18px monospace';
    ctx.fillText('Press R or click to restart', W / 2, H / 2 + 25);
  }

  document.getElementById('score').textContent = `Score: ${score}  |  High: ${high}`;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function jump() {
  if (gameOver) { reset(); return; }
  if (player.onGround) {
    player.vy = JUMP_V;
    player.onGround = false;
    player.jumpHeld = true;
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  if (e.code === 'KeyR') reset();
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') player.jumpHeld = false;
});
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('mouseup', () => player.jumpHeld = false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });
canvas.addEventListener('touchend', () => player.jumpHeld = false);

loop();
</script>
</body>
</html>
